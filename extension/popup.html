<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mono</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    width: 190px;
    padding: 10px 0 8px;
    background: #050706;
    color: #c4d2c8;
    font: 500 12px/1.5 ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }
  h1 {
    margin: 0 14px 8px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: #5a7062;
  }
  button {
    all: unset;
    display: block;
    box-sizing: border-box;
    width: 100%;
    padding: 5px 14px;
    cursor: pointer;
    color: #c4d2c8;
  }
  button::before { content: "  "; white-space: pre; }
  button[aria-pressed="true"] { color: #56ff9f; }
  button[aria-pressed="true"]::before { content: "> "; }
  button:hover, button:focus-visible { background: #0e1711; }
  p { margin: 8px 14px 0; font-size: 10px; color: #5a7062; }
</style>
</head>
<body>
<h1>MONO</h1>
<button data-look="phosphor">phosphor</button>
<button data-look="neon">neon</button>
<button data-look="paper">paper</button>
<button data-look="off">off</button>
<p>&#8997;&#8679;M on / off<br>&#8997;&#8679;L next look</p>
<script src="popup.js"></script>
</body>
</html>
